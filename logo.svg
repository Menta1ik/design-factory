  <text x="35" y="65" fill="url(#cyberGradient)" font-family="Courier New, Courier, monospace" font-size="13" font-weight="bold" xml:space="preserve">
    <tspan x="35" dy="16">    ____           _                ______           __                  </tspan>
    <tspan x="35" dy="16">   / __ \___  ____(_)___ _____     / ____/___ ______/ /_____  _______  __</tspan>
