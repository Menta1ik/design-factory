    <tspan x="35" dy="16"> / /_/ /  __(__  ) / /_/ / / / /  / __/ / /_/ / /__/ /_/ /_/ / /  / /_/ / </tspan>
    <tspan x="35" dy="16">/_____/\___/____/_/\__, /_/ /_/  /_/    \__,_/\___/\__/\____/_/   \__, /  </tspan>
    <tspan x="35" dy="16">                  /____/                                         /____/   </tspan>
  </text>

  <!-- Status indicator badge inside the terminal -->
  <rect x="35" y="188" width="730" height="24" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="50" cy="200" r="4" fill="#27c93f" />
  <text x="62" y="204" fill="#8a8f98" font-family="Courier New, monospace" font-size="10" letter-spacing="0.03em">SYSTEM DIAGNOSTICS: FULLY OPERATIONAL (AI OPTIMIZER ACTIVE)</text>
