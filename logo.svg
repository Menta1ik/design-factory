  <circle cx="45" cy="22" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="22" r="6" fill="#27c93f" />

  <!-- Terminal path title -->
  <text x="95" y="26" fill="#8a8f98" font-family="Courier New, monospace" font-size="11" letter-spacing="0.05em">vibe-coder@kharkiv: ~/design-factory</text>

